<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Pokedex</title>
    <link rel="stylesheet" href="./variables.css" />
    <link rel="stylesheet" href="./fonts.css" />
    <link rel="stylesheet" href="./reset.css" />
    <link rel="stylesheet" href="./style.css" />
    <script src="./template.js" defer></script>
    <script src="./script.js" defer></script>
  </head>
  <body>
    <header class="pokedex-header">
      <div class="pokedex-lens"></div>
      <div class="pokedex-leds"><span></span><span></span><span></span></div>
      <h1>Pokedex</h1>
      <div class="search-bar">
        <input
          id="searchInput"
          data-id="search-input"
          type="text"
          placeholder="min. 3 letters"
        />
        <button id="searchButton" data-id="search-button">Search</button>
      </div>
    </header>
    <main id="content" data-id="content"></main>
    <button
      id="loadMoreButton"
      data-id="load-more-button"
      onclick="loadMorePokemon()"
    >
      Load more
    </button>
    <dialog id="detailDialog" data-id="dialog"></dialog>
  </body>
</html>
