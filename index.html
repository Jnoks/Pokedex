<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Pokedex</title>
    <link rel="stylesheet" href="./variables.css" />
    <link rel="stylesheet" href="./fonts.css" />
    <link rel="stylesheet" href="./reset.css" />
    <link rel="stylesheet" href="./style.css" />
    <script src="./template.js" defer></script>
    <script src="./script.js" defer></script>
  </head>
  <body>
    <header class="pokedex-header">
      <div class="pokedex-lens"></div>
      <div class="pokedex-leds"><span></span><span></span><span></span></div>
      <h1>Pokedex</h1>
      <div class="search-bar">
        <input
          id="searchInput"
          type="text"
          placeholder="min. 3 letters"
          oninput="filterPokemon()"
        />
        <button id="searchButton" onclick="filterPokemon()">Search</button>
      </div>
    </header>
    <main id="content"></main>
    <button id="loadMoreButton" onclick="loadMorePokemon()">Load more</button>
    <footer class="pokedex-footer">
      <address class="footer-imprint">Jnoks · Developer Akademie</address>
      <div class="pokedex-speaker"></div>
    </footer>
    <div id="loadingScreen" class="loading-screen d-none">
      <div class="pokeball-spinner"></div>
    </div>
    <dialog id="detailDialog"></dialog>
  </body>
</html>
